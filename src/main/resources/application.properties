spring.application.name=mes-dashboard

# Docker 등에서는 SPRING_DATASOURCE_* 환경변수로 덮어씀. 로컬 실행 시 본인 Postgres 계정에 맞게 수정할 것.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mes}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:leehyunji}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# data.sql이 Hibernate 테이블 생성 이후에 실행되도록 순서 강제
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always